# =============================================================================
# Satisfactory (dedicated server) — reference game definition
# Game Server Config Standard (GSC), draft v0.1
#
# Seventh worked example: an HTTP API TARGET. Most server settings live in a
# binary save the server manages itself (ServerSettings.<port>.sav), with no
# documented file format. The supported way to change them is the server's
# HTTPS API, which only works while the server is running:
#
#   POST https://<host>:7777/api/v1
#   Authorization: Bearer <token>
#   {"function": "ApplyServerOptions", "data": {"UpdatedServerOptions": {"FG.AutosaveInterval": "300"}}}
#
# New format features:
#   - `type: http` targets: endpoint, TLS policy, request/response envelope,
#     authentication, and a bootstrap sequence for claiming a new server
#   - `call` writes: a setting becomes one API function call, or one key in a
#     map that several settings share (`merge`), sent as a single call
#   - `read` through the API, including which values are still pending a restart
#   - `requiresRunning`: the opposite of Palworld's writeWhen: stopped
#   - command-line arguments that carry an INI override (-ini:File:[Section]:Key=Value),
#     another format inside a format, which survives the server rewriting its INIs
#
# Sources: Official Satisfactory Wiki "Dedicated servers/HTTPS API";
# GameServerKings "Satisfactory dedicated server commands, API and settings";
# XGamingServer "Satisfactory server HTTPS API". Items marked `# verify` are
# from memory.
# =============================================================================

spec: gsc/v0.1
kind: GameDefinition

# Identity for registries: publisher/name, a semantic version, and a license.
definition:
  id: gsc-examples/satisfactory
  version: 0.1.1
  license: CC0-1.0                 # definitions are data; a permissive license lets any panel ship them
  authors: [GSC draft examples]

game:
  id: satisfactory
  name: Satisfactory
  engine: unreal-5
  steam:
    appId: 526870            # verify
    dedicatedAppId: 1690800  # verify
  platforms: [linux, windows]

ports:
  game:
    purpose: game
    protocol: both           # UDP: game traffic and the lightweight query API; TCP: server traffic and the HTTPS API
    default: 7777
    setting: network.port
    exposure: public
    speaks: [satisfactory-https-api, satisfactory-lightweight-query]

  reliable:
    purpose: game
    protocol: tcp
    default: 8888            # players can hang on the loading screen if this is not reachable
    setting: network.reliablePort
    exposure: public

console: none                 # the console is stdin only; the API replaces remote commands

# -----------------------------------------------------------------------------
# Targets
# -----------------------------------------------------------------------------
targets:
  commandLine:
    type: args
    style: equals             # -Port=7777
    # INI overrides on the command line survive the server rewriting its INIs
    # on shutdown:  -ini:Game:[/Script/Engine.GameSession]:MaxPlayers=8

  api:
    type: http
    baseUrl: "https://{host}:{ports.game}/api/v1"
    requiresRunning: true      # settings live in the server's own save; edits wait until it runs
    booleans: ["True", "False"]   # option values are a map<string,string>   # verify spelling
    tls:
      selfSigned: true         # generated by the server unless a certificate is supplied
      verify: pinOnFirstUse    # trust the first certificate seen, then alert if it changes
    request:
      method: POST
      contentType: application/json
      envelope: { function: "{call}", data: "{data}" }
    response:
      data: data
      error: { code: errorCode, message: errorMessage, details: errorData }
      status:                  # HTTP status -> outcome
        "200": result          # success or error envelope
        "202": accepted        # still processing (e.g. LoadGame)
        "204": ok              # success, no body
        "401": reauthenticate  # token missing or expired
        "403": forbidden
    auth:
      type: bearer
      # Prefer an application token: it does not expire. It is created on the
      # server console with server.GenerateAPIToken, so a person (or the panel's
      # stdin access) has to create it once.
      token: "{settings.admin.apiToken}"
      # Otherwise log in with the admin password for a short-lived token.
      fallback:
        call: PasswordLogin
        data: { MinimumPrivilegeLevel: Administrator, Password: "{settings.admin.adminPassword}" }
        token: [authenticationToken, AuthenticationToken]   # servers return lowercase despite the docs
    bootstrap:
      # Only a server with no admin password hands out an InitialAdmin token
      # without a password, so that probe tells a new server from a claimed one.
      probe:
        call: PasswordlessLogin
        data: { MinimumPrivilegeLevel: InitialAdmin }
        token: [authenticationToken]
        doneWhen: { errorCode: passwordless_login_not_possible }   # already claimed: skip the steps
      steps:
        - call: ClaimServer
          data: { ServerName: "{settings.general.serverName}", AdminPassword: "{settings.admin.adminPassword}" }
          token: [authenticationToken]          # switch to the returned admin token
    batch:
      # Settings that write into the same map are sent together in one call.
      ApplyServerOptions: { mapField: UpdatedServerOptions }
    read:
      GetServerOptions:
        current: ServerOptions
        pending: PendingServerOptions          # applied when the session or server restarts

# -----------------------------------------------------------------------------
# Settings
# -----------------------------------------------------------------------------
settings:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:

    general:
      title: General
      type: object
      properties:
        serverName:
          title: Server name
          type: string
          minLength: 1
          default: "Satisfactory Server"
          apply: live
          write:
            - { target: api, call: RenameServer, data: { ServerName: "{value}" } }

        clientPassword:
          title: Join password
          description: Empty removes the password. Changing it signs out players' existing sessions.
          type: string
          writeOnly: true
          default: ""
          apply: live
          write:
            # Sending it signs players out, and it cannot be read back to compare,
            # so the adapter sends it only when it differs from what it last sent.
            - { target: api, call: SetClientPassword, data: { Password: "{value}" }, sendWhen: changed }

        maxPlayers:
          title: Max players
          classes: [resource]
          description: Marked experimental by the game.
          type: integer
          minimum: 1
          default: 4                           # verify
          apply: restart
          write:
            - { target: commandLine, arg: "-ini:Game:[/Script/Engine.GameSession]:MaxPlayers" }

    saves:
      title: Saving
      type: object
      properties:
        autosaveInterval:
          title: Autosave interval
          type: integer
          minimum: 0
          default: 300
          ui: { unit: seconds }
          apply: live                          # the server may report it as pending instead
          write:
            - { target: api, call: ApplyServerOptions, key: "FG.AutosaveInterval", as: string }
          read: { target: api, call: GetServerOptions, key: "FG.AutosaveInterval" }

        autoPause:
          title: Pause when no players are connected
          type: boolean
          default: true                        # verify
          apply: live
          write:
            - { target: api, call: ApplyServerOptions, key: "FG.DSAutoPause", as: string }   # verify key
          read: { target: api, call: GetServerOptions, key: "FG.DSAutoPause" }

        saveOnDisconnect:
          title: Save when the last player leaves
          type: boolean
          default: true                        # verify
          apply: live
          write:
            - { target: api, call: ApplyServerOptions, key: "FG.DSAutoSaveOnDisconnect", as: string }   # verify key
          read: { target: api, call: GetServerOptions, key: "FG.DSAutoSaveOnDisconnect" }

        rotatingAutosaves:
          title: Rotating autosaves kept
          type: integer
          minimum: 1
          default: 3                           # verify
          apply: restart
          write:
            - { target: commandLine, arg: "-ini:Engine:[/Script/FactoryGame.FGSaveSession]:mNumRotatingAutosaves" }

        autoLoadSession:
          title: Session to load on start
          description: Takes effect the next time the server starts; the loaded session does not change.
          type: string
          default: ""
          apply: restart                       # written live, takes effect at the next start
          write:
            - { target: api, call: SetAutoLoadSessionName, data: { SessionName: "{value}" }, skipIfEmpty: true }

    network:
      title: Network
      type: object
      scopes: []
      properties:
        port:
          title: Game and API port
          type: integer
          minimum: 1024
          maximum: 65535
          default: 7777
          apply: restart
          write: [{ target: commandLine, arg: "-Port" }]

        reliablePort:
          title: Reliable messaging port
          type: integer
          minimum: 1024
          maximum: 65535
          default: 8888
          apply: restart
          write: [{ target: commandLine, arg: "-ReliablePort" }]

    admin:
      title: Administration
      type: object
      scopes: []
      properties:
        adminPassword:
          title: Admin password
          description: Used to claim a new server and to log in to the API.
          type: string
          writeOnly: true
          minLength: 1
          default: "<required>"
          apply: live
          reconnectsConsole: true              # changing it invalidates existing tokens
          write:
            - target: api
              call: SetAdminPassword
              data: { Password: "{value}", AuthenticationToken: "{auth.newToken}" }   # verify how the new token is formed
              sendWhen: changed                  # invalidates every client and admin token

        apiToken:
          title: API token
          description: Optional. Created on the server console with server.GenerateAPIToken. Does not expire.
          type: string
          writeOnly: true
          default: ""
          apply: live
          write: []                            # used to authenticate, never written to the server

        insecureLocalAccess:
          title: Allow unauthenticated API access from localhost
          classes: [security]
          description: Only for an adapter running on the same host. Anyone with local access gets full control.
          type: boolean
          default: false
          apply: restart
          write:
            - { target: commandLine, arg: "-ini:Engine:[SystemSettings]:FG.DedicatedServer.AllowInsecureLocalAccess" }

rules:
  - rule: "self.network.port != self.network.reliablePort"
    message: "The game port and the reliable messaging port must differ."
  - rule: "self.admin.adminPassword != '<required>'"
    message: "Set an admin password; it is needed to claim the server and to use the API."
  - rule: "!self.admin.insecureLocalAccess"
    message: "Unauthenticated localhost access gives full control to anything on the host."
    severity: warning

# -----------------------------------------------------------------------------
# Live state (gsc-state/v0.1), through the same HTTPS API as the settings.
# -----------------------------------------------------------------------------
state:
  ready:
    any: [{ query: satisfactory-https-api, field: serverGameState.isGameRunning }]
  queries:
    - { protocol: satisfactory-https-api, port: game, every: 15s, requests: [state] }
  reports:
    general.maxPlayers: { from: satisfactory-https-api, field: serverGameState.playerLimit }
